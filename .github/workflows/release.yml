# Before building (signed mode) or promoting, the scripts check that the tagged commit is on
# origin/main and passed the Test workflow (scripts/release/check-release-gate.sh); the whole
# history is fetched for that.
# Release: two paths by tag (docs/Releasing.md, "Phát hành một tag").
# - vX.Y.Z-beta.N builds Dấu with scripts/release/build-release.sh and makes a DRAFT GitHub
#   pre-release with the DMG, the dSYMs and the updated appcast. Nothing is published and the
#   appcast on the site is not touched.
# - vX.Y.Z (stable) builds NOTHING: scripts/release/promote-release.sh takes the DMG and dSYMs of
#   the last beta on the same commit and makes a DRAFT release from them, same binary, same
#   notarization ticket; the appcast.xml asset is the published appcast with the channel tag
#   removed from that beta's item, no new item (D7).
# With the secrets below the build is signed with Developer ID, notarized and the appcast is
# signed; without them it builds a development build (D7), unsigned and not for users, and
# makes NO release: the *-dev-unsigned.dmg is only an artifact of the run (7 days),
# so nothing unsigned ever sits in the Releases list, one click from public.
name: Release

on:
  push:
    tags: ['v*']

# contents: create the draft release. actions: the scripts read the result of the Test workflow
# (check-release-gate.sh) before building or promoting.
permissions:
  contents: write
  actions: read

env:
  # Whether the certificate secret is set (a boolean, not the secret): `if:` cannot read secrets.
  DAU_HAS_DEVELOPER_ID: ${{ secrets.DAU_DEVELOPER_ID_P12 != '' }}

# Secrets live only in the env of the two steps that use them, never workflow-wide: other
# steps run third-party code (Homebrew formulae, actions).
jobs:
  # Any tag with a hyphen (a beta, or a malformed one that the script then refuses).
  release:
    if: contains(github.ref_name, '-')
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The build number comes from the commit count of HEAD: needs the whole history.
          fetch-depth: 0

      # The Xcode named in .xcode-version, not the image default: the one the project is developed with.
      - name: Select Xcode
        run: |
          v=$(<.xcode-version)
          dir=/Applications/Xcode_$v.app/Contents/Developer
          if [[ ! -d $dir ]]; then
            echo "::error::Xcode $v (.xcode-version) is not on this runner. Installed: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$dir"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import the Developer ID certificate
        if: env.DAU_HAS_DEVELOPER_ID == 'true'
        env:
          DAU_DEVELOPER_ID_P12: ${{ secrets.DAU_DEVELOPER_ID_P12 }}
          DAU_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DAU_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/dau-release.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$DAU_DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/dau-cert.p12"
          security import "$RUNNER_TEMP/dau-cert.p12" -k "$keychain" -P "$DAU_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dau-cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "DAU_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build the release
        id: build
        # Passed to the script by name (scripts/release/build-release.sh, "Mode"). GH_TOKEN: the
        # signed mode reads releases and the Test result through gh before building.
        env:
          GH_TOKEN: ${{ github.token }}
          DAU_TEAM_ID: ${{ secrets.DAU_TEAM_ID }}
          DAU_SPARKLE_PUBLIC_KEY: ${{ secrets.DAU_SPARKLE_PUBLIC_KEY }}
          DAU_SPARKLE_PRIVATE_KEY: ${{ secrets.DAU_SPARKLE_PRIVATE_KEY }}
          DAU_NOTARY_KEY: ${{ secrets.DAU_NOTARY_KEY }}
          DAU_NOTARY_KEY_ID: ${{ secrets.DAU_NOTARY_KEY_ID }}
          DAU_NOTARY_ISSUER_ID: ${{ secrets.DAU_NOTARY_ISSUER_ID }}
        run: scripts/release/build-release.sh --tag "$GITHUB_REF_NAME" --layout

      - name: Summary
        run: cat build/release/summary.txt

      - name: Keep the unsigned development build and its Checksums.json as an artifact
        if: steps.build.outputs.signed != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dau-dev-unsigned-DO-NOT-DISTRIBUTE
          path: |
            ${{ steps.build.outputs.dmg }}
            ${{ steps.build.outputs.checksums }}
          retention-days: 7

      - name: Draft GitHub release
        if: steps.build.outputs.signed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --title "Dấu ${{ steps.build.outputs.label }}" --generate-notes)
          case "$GITHUB_REF_NAME" in *-beta.*) flags+=(--prerelease) ;; esac
          files=("${{ steps.build.outputs.dmg }}" "${{ steps.build.outputs.dsyms }}" "${{ steps.build.outputs.checksums }}")
          # The updated appcast and Checksums.json are release assets, not published: docs/Releasing.md.
          if [ -n "${{ steps.build.outputs.appcast }}" ]; then files+=("${{ steps.build.outputs.appcast }}"); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" "${files[@]}"

      - name: Remove the keychain
        if: always() && env.DAU_KEYCHAIN != ''
        run: security delete-keychain "$DAU_KEYCHAIN" || true

  # Stable tag: promote the last beta, no build, no secrets. Checks the signature and the
  # stapled ticket of the DMG with codesign, stapler and spctl, so it needs the macOS runner.
  promote:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The script reads which beta tags point at the commit of the tag.
          fetch-depth: 0

      - name: Draft the stable release from the last beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/promote-release.sh --tag "$GITHUB_REF_NAME"
