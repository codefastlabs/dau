# XcodeGen spec for Dấu. Generate the project with `xcodegen generate`.
# Dau.xcodeproj is generated and git-ignored: edit this file, never the .xcodeproj.
#
# BUNDLE_ID_PREFIX is settled in D24 (com.codefastlabs.dau, from the domain dau.codefastlabs.com);
# ask the user before changing it. The input mode ID is hard-coded in
# Apps/DauInputMethod/Info.plist and Resources/InfoPlist.xcstrings: update both with it.
# DEVELOPMENT_TEAM lives in Config/Signing.xcconfig: the maintainer's free Personal Team
# (M58DANM3ZP) unless Config/Local.xcconfig (git-ignored) sets another one (CONTRIBUTING.md).
# Builds are signed "Apple Development" with automatic signing: the App Group needs a real
# Team ID, macOS rejects it for ad-hoc signed builds (D24, Tên và định danh). No provisioning
# profile is needed: a Team-ID-prefixed App Group is allowed on macOS without one.
# Developer ID signing and notarization: CI overrides these via xcodebuild settings
# (scripts/release/build-release.sh).

name: Dau

options:
  bundleIdPrefix: com.codefastlabs.dau
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  # build/generated/BuildCommit.txt must exist when the project is generated, or the
  # optional resource below is left out of both targets.
  preGenCommand: scripts/build/stamp-build-commit.sh

packages:
  DauEngine:
    path: Packages/DauEngine
  DauShared:
    path: Packages/DauShared
  # Exact pin: Package.resolved is git-ignored, so project.yml is the only record of the
  # version (2.10.1); bump it on purpose, never by a floating range. Only the host app
  # links it (D7); the input method never does (N2: no network code in the input method).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    BUNDLE_ID_PREFIX: com.codefastlabs.dau
    # App Group shared by the host app and the input method (settings, compatibility list).
    # TeamIdentifierPrefix is "<DEVELOPMENT_TEAM>." (empty only for ad-hoc builds).
    APP_GROUP_ID: $(TeamIdentifierPrefix)$(BUNDLE_ID_PREFIX).shared
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_HARDENED_RUNTIME: YES
    # Shared by every target (host app and input method report the same version).
    # Info.plist files read them via $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION).
    # Release builds (scripts/release/build-release.sh) set MARKETING_VERSION from the tag and
    # CURRENT_PROJECT_VERSION from the commit count; development builds from
    # scripts/dev/install-app.sh set MARKETING_VERSION from the nearest vX.Y.Z tag on HEAD
    # (scripts/lib/build.sh). A build from Xcode itself keeps the values here.
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # D1: universal binary (Apple silicon + Intel).
    ARCHS: arm64 x86_64
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # D25: the standard icon only on the official build. Only the CI release build passes
    # DAU_OFFICIAL=YES (xcodebuild DAU_OFFICIAL=YES); everything else (Debug, a local Release,
    # someone else's build) gets the development icon and no DAU_OFFICIAL condition. Both
    # targets share the Icon Composer documents, so both read DAU_APPICON.
    DAU_OFFICIAL: NO
    DAU_APPICON_NO: AppIconDev
    DAU_APPICON_YES: AppIcon
    DAU_APPICON: $(DAU_APPICON_$(DAU_OFFICIAL))
    # A swiftc flag, not SWIFT_ACTIVE_COMPILATION_CONDITIONS: set here, that setting
    # replaces XcodeGen's per-config preset and Debug loses DEBUG.
    DAU_SWIFT_FLAG_NO: ""
    DAU_SWIFT_FLAG_YES: -DDAU_OFFICIAL
    # D7: the Sparkle feed URL and public EdDSA key exist only on the official build. CI passes
    # DAU_SPARKLE_PUBLIC_KEY (from the maintainer's key, never committed) with DAU_OFFICIAL=YES;
    # the "Sparkle keys" phase of the Dau target fails the build when it is empty.
    DAU_SPARKLE_FEED_URL: https://dau.codefastlabs.com/appcast.xml
    DAU_SPARKLE_PUBLIC_KEY: ""
    OTHER_SWIFT_FLAGS: $(inherited) $(DAU_SWIFT_FLAG_$(DAU_OFFICIAL))
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: NO
    COMBINE_HIDPI_IMAGES: YES
  configs:
    # Local Swift packages ignore the app's ONLY_ACTIVE_ARCH and build only the active arch
    # when xcodebuild targets "My Mac". Debug therefore builds the active arch by default;
    # pass -destination 'generic/platform=macOS' to get a universal Debug build (docs/Architecture.md, "Build").
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
      # No com.apple.security.get-task-allow (Xcode adds it to every "Apple Development"
      # signature): a debuggable input method lets another process of the user attach
      # and read the word being typed. Release builds are the ones used day to day.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:
  Dau:
    type: application
    platform: macOS
    sources:
      - path: Apps/Dau/Sources
      - path: Apps/Dau/Resources
      - path: build/generated/BuildCommit.txt
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Dau
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        INFOPLIST_FILE: Apps/Dau/Info.plist
        # D37: no App Sandbox for the host app (it installs, upgrades and removes the
        # input method); App Group + hardened runtime only. The input method keeps its
        # sandbox. Never set ENABLE_APP_SANDBOX here.
        CODE_SIGN_ENTITLEMENTS: Apps/Dau/Dau.entitlements
        # Icon Composer documents Apps/Dau/Resources/AppIcon.icon and AppIconDev.icon
        # (scripts/assets/make-app-icon.sh, docs/Brand.md); the one named here is compiled,
        # chosen by DAU_OFFICIAL (D25). The input method shares them for its Finder icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: $(DAU_APPICON)
    # build/generated/BuildCommit.txt is written by the input method's "Stamp build
    # commit" phase; this target builds after it (dependency below).
    # D7: SUFeedURL and SUPublicEDKey are written into the built Info.plist only when
    # DAU_OFFICIAL=YES, and removed otherwise (a stale key from an earlier official build in
    # the same DerivedData must not survive). Why a phase and not Info.plist: Info.plist
    # cannot make a key conditional, and the C-preprocessor route (INFOPLIST_PREPROCESS) mangles
    # the "//" of a URL in traditional mode. The phase runs before code signing, so the
    # seal covers the result. It edits the built Info.plist in place, which Xcode's build
    # system rejects as a declared output ("mutable output"), so the phase declares the plist
    # as input only (that orders it after the Info.plist task) and the Dau target turns the
    # user script sandbox off (the script runs only PlistBuddy).
    postBuildScripts:
      - name: Sparkle keys
        basedOnDependencyAnalysis: false
        # Declared input: makes Xcode run the script after the Info.plist task, whatever the
        # phase order (without it the script ran first and the plist was overwritten).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -eu
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          pb=/usr/libexec/PlistBuddy
          [ -f "$plist" ] || { echo "error: $plist not built yet" >&2; exit 1; }
          if [ "$DAU_OFFICIAL" = "YES" ]; then
            if [ -z "${DAU_SPARKLE_PUBLIC_KEY:-}" ]; then
              echo "error: DAU_OFFICIAL=YES needs DAU_SPARKLE_PUBLIC_KEY (the public EdDSA key from Sparkle's generate_keys); see docs/Releasing.md" >&2
              exit 1
            fi
            for pair in "SUFeedURL:$DAU_SPARKLE_FEED_URL" "SUPublicEDKey:$DAU_SPARKLE_PUBLIC_KEY"; do
              k="${pair%%:*}"; v="${pair#*:}"
              "$pb" -c "Delete :$k" "$plist" 2>/dev/null || true
              "$pb" -c "Add :$k string $v" "$plist"
            done
          else
            "$pb" -c "Delete :SUFeedURL" "$plist" 2>/dev/null || true
            "$pb" -c "Delete :SUPublicEDKey" "$plist" 2>/dev/null || true
          fi
    dependencies:
      - package: DauShared
      - package: Sparkle
        product: Sparkle
      # The input method bundle ships inside the host app and is copied to
      # ~/Library/Input Methods by the host app at install time (M5).
      # Contents/Library/<subdir> is a standard location for nested code, so it is
      # signed and sealed as code (Contents/Resources is for non-code resources only).
      - target: DauInputMethod
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/Input Methods

  DauInputMethod:
    type: application
    platform: macOS
    sources:
      - path: Apps/DauInputMethod/Sources
      - path: Apps/DauInputMethod/Resources
      # The host app's Icon Composer documents (AppIcon and AppIconDev), shared rather than
      # copied: the bundle gets the same Finder icon as Dấu.app (CFBundleIconName,
      # Assets.car, AppIcon.icns).
      # The input source icons (menu bar V, ⌃Space indicator) are not app icons: they
      # stay the template TIFF named in Info.plist (tsInputMethodIconFileKey, mode keys,
      # TISIconIsTemplate; docs/history/CompatibilityFixed.md).
      - path: Apps/Dau/Resources/AppIcon.icon
      - path: Apps/Dau/Resources/AppIconDev.icon
      - path: build/generated/BuildCommit.txt
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: DauInputMethod
        ASSETCATALOG_COMPILER_APPICON_NAME: $(DAU_APPICON)
        # Input method bundle IDs conventionally contain ".inputmethod.".
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).inputmethod.Dau
        INFOPLIST_FILE: Apps/DauInputMethod/Info.plist
        # N2: the input method has no network entitlement. Never add network.client here.
        CODE_SIGN_ENTITLEMENTS: Apps/DauInputMethod/DauInputMethod.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      # build/generated/BuildCommit.txt (scripts/build/stamp-build-commit.sh), copied into
      # Resources below (here and in Dau, which builds after this target): every build,
      # so the commit never goes stale. It reads .git, hence no user script sandbox.
      - name: Stamp build commit
        script: '"$SRCROOT/scripts/build/stamp-build-commit.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/build/generated/BuildCommit.txt
    dependencies:
      - package: DauEngine
      - package: DauShared
      - sdk: InputMethodKit.framework

  # Logic tests for the input method's pure helpers (key routing, cursor tracking,
  # settings → engine options, host app lookup, legacy cleanup, underline mode,
  # in-place mode with D20, user vs system launch).
  # No host app: the files are compiled straight into the test bundle.
  DauInputMethodTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Apps/DauInputMethod/Tests
      - path: Apps/DauInputMethod/Sources/KeyRouter.swift
      - path: Apps/DauInputMethod/Sources/CursorTracker.swift
      - path: Apps/DauInputMethod/Sources/CursorTrackerRebuild.swift
      - path: Apps/DauInputMethod/Sources/ClientRange.swift
      - path: Apps/DauInputMethod/Sources/MarkedComposer.swift
      - path: Apps/DauInputMethod/Sources/InPlaceComposer.swift
      - path: Apps/DauInputMethod/Sources/PerfLog.swift
      - path: Apps/DauInputMethod/Sources/EngineSettings.swift
      - path: Apps/DauInputMethod/Sources/HostApp.swift
      - path: Apps/DauInputMethod/Sources/LaunchOrigin.swift
    dependencies:
      - package: DauEngine
      - package: DauShared
    settings:
      base:
        PRODUCT_NAME: DauInputMethodTests
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).inputmethod.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Dau:
    build:
      targets:
        Dau: all
    run:
      config: Debug
    archive:
      config: Release
  DauInputMethod:
    build:
      targets:
        DauInputMethod: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DauInputMethodTests
    archive:
      config: Release
